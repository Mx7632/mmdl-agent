<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答 - MMDL@NUAA</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%;">
            <div style="display: flex; align-items: center; gap: 20px; flex: 1;">
                <h1 style="margin: 0; font-size: 1.5rem; color: #2563eb;">MMDL@NUAA</h1>
                <span style="font-size: 0.9rem; color: #64748b;">自主规划智能体</span>
            </div>
            <div style="display: flex; gap: 24px;">
                <a href="index.html" style="color: #64748b; text-decoration: none; font-weight: 500;">仪表板</a>
                <a href="chat.html" style="color: #2563eb; text-decoration: none; font-weight: 600;">智能问答</a>
                <a href="expert_inspection.html" style="color: #64748b; text-decoration: none; font-weight: 500;">专家质检</a>
                <a href="rag.html" style="color: #64748b; text-decoration: none; font-weight: 500;">知识库</a>
            </div>
        </div>
    </nav>

    <div class="chat-container">
        <!-- Sidebar: Context & Settings -->
        <aside class="chat-sidebar">
            <div class="sidebar-section">
                <h3><i class="fas fa-info-circle"></i> 关于智能问答</h3>
                <p style="font-size: 0.875rem; color: #475569; line-height: 1.6;">
                    基于自主规划（Autonomous Planning）架构。Agent 会根据您的提问，动态调度视觉检测和知识库检索能力。
                </p>
            </div>

            <div class="sidebar-section">
                <h3><i class="fas fa-cog"></i> 检索配置</h3>
                <div class="form-group">
                    <label style="font-size: 0.75rem; font-weight: 600;">零件类别 (Optional)</label>
                    <select id="category-select" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0;">
                        <option value="">自动识别</option>
                        <option value="bottle">瓶子</option>
                        <option value="cable">电缆</option>
                        <option value="capsule">胶囊</option>
                        <option value="metal_nut">金属螺母</option>
                        <option value="screw">螺丝</option>
                        <option value="tile">瓷砖</option>
                    </select>
                </div>
            </div>

            <div id="image-preview-area" class="sidebar-section" style="display: none;">
                <h3><i class="fas fa-image"></i> 待检图片</h3>
                <div style="position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0;">
                    <img id="chat-image-preview" src="" style="width: 100%; display: block;">
                    <button id="remove-image" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.5); color: white; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer;">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #e2e8f0;">
                <button onclick="clearChat()" style="width: 100%; padding: 10px; background: #f1f5f9; border: none; border-radius: 6px; color: #64748b; cursor: pointer;">
                    <i class="fas fa-trash-alt"></i> 清空对话
                </button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div id="chat-messages" class="chat-messages">
                <!-- Welcome Message -->
                <div class="message-bubble message-agent">
                    你好！我是 MMDL@NUAA 工业智能助手。你可以上传设备图片并提问，我会自动规划分析步骤，为您提供专业的诊断报告。
                </div>
            </div>

            <div class="chat-input-area">
                <div class="input-wrapper">
                    <div class="input-container">
                        <button id="upload-trigger" class="chat-btn btn-upload" title="上传图片">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <input type="file" id="chat-image-input" accept="image/*" style="display: none;">
                        
                        <textarea id="chat-input" placeholder="请输入您的问题，例如：这张图片里的零件有什么异常？" rows="1"></textarea>
                        
                        <button id="send-btn" class="chat-btn btn-send">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    <div style="font-size: 0.75rem; color: #94a3b8; text-align: center;">
                        Shift + Enter 换行 | 支持图片拖拽上传
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/chat.js"></script>
</body>
</html>

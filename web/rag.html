<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Console - MMDL-Agent</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rag-console.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-wrap">
            <div class="nav-left">
                <h1 class="brand">🧠 MMDL-Agent</h1>
                <span class="brand-sub">Industrial Anomaly RAG Console</span>
            </div>
            <div class="nav-right">
                <a href="index.html">Dashboard</a>
                <a href="detection.html">Detection</a>
                <a href="rag.html" class="active">RAG Console</a>
            </div>
        </div>
    </nav>

    <header class="rag-hero">
        <div class="hero-inner">
            <h1>工业异常 RAG 控制台</h1>
            <p>一站式完成样本建库、相似案例检索、在线高置信反馈入库</p>
            <div class="hero-chips">
                <span class="chip">/v1/rag/build</span>
                <span class="chip">/v1/rag/query</span>
                <span class="chip">/v1/rag/ingest-feedback</span>
            </div>
        </div>
    </header>

    <main class="rag-main">
        <section class="panel panel-build">
            <div class="panel-head">
                <h2>① 构建向量库</h2>
                <button id="build-btn" class="btn btn-primary">开始建库</button>
            </div>
            <div class="panel-body grid-2">
                <div class="form-group">
                    <label for="dataset-root">数据集路径</label>
                    <input id="dataset-root" type="text" value="data_sets/mvtec_anomaly_detection" placeholder="data_sets/mvtec_anomaly_detection">
                </div>
                <div class="form-group inline-check">
                    <input id="include-normal" type="checkbox" checked>
                    <label for="include-normal">包含正常样本（good）</label>
                </div>
            </div>
            <pre id="build-result" class="result-box">等待执行建库...</pre>
        </section>

        <section class="panel panel-query">
            <div class="panel-head">
                <h2>② 相似案例查询</h2>
                <button id="query-btn" class="btn btn-secondary">执行查询</button>
            </div>
            <div class="panel-body grid-3">
                <div class="form-group">
                    <label for="query-text">查询描述</label>
                    <textarea id="query-text" rows="3" placeholder="例如：瓶口附近存在裂纹并伴随污染"></textarea>
                </div>
                <div class="form-group">
                    <label for="query-category">类别过滤（可选）</label>
                    <input id="query-category" type="text" placeholder="bottle / cable / screw ...">
                </div>
                <div class="form-group">
                    <label for="query-topk">Top K</label>
                    <input id="query-topk" type="number" value="5" min="1" max="20">
                </div>
            </div>
            <div class="query-layout">
                <pre id="query-result" class="result-box">等待执行查询...</pre>
                <div class="prompt-box">
                    <h3>可注入大模型的上下文</h3>
                    <pre id="query-context">暂无上下文</pre>
                </div>
            </div>
        </section>

        <section class="panel panel-feedback">
            <div class="panel-head">
                <h2>③ 在线反馈入库</h2>
                <button id="ingest-btn" class="btn btn-success">写入反馈样本</button>
            </div>
            <div class="panel-body grid-2">
                <div class="form-group">
                    <label for="feedback-image-path">图片路径</label>
                    <input id="feedback-image-path" type="text" placeholder="data/online/case_001.png">
                </div>
                <div class="form-group">
                    <label for="feedback-category">类别</label>
                    <input id="feedback-category" type="text" value="unknown">
                </div>
                <div class="form-group">
                    <label for="feedback-description">用户描述</label>
                    <textarea id="feedback-description" rows="3" placeholder="用户确认：瓶口裂纹明显，需停线复检"></textarea>
                </div>
                <div class="form-group">
                    <label for="feedback-confidence">模型置信度（0-1）</label>
                    <input id="feedback-confidence" type="number" step="0.01" min="0" max="1" value="0.92">
                </div>
                <div class="form-group">
                    <label for="feedback-anomaly-type">异常类型（可选）</label>
                    <input id="feedback-anomaly-type" type="text" placeholder="broken_small">
                </div>
                <div class="form-group">
                    <label for="feedback-severity">严重程度（可选）</label>
                    <select id="feedback-severity">
                        <option value="">unknown</option>
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                    </select>
                </div>
            </div>
            <pre id="ingest-result" class="result-box">等待反馈入库...</pre>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 MMDL-Agent · RAG Console</p>
    </footer>

    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/rag-console.js"></script>
</body>
</html>

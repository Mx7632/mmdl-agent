<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMDL-Agent 智能工业检测系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f2e 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        /* 背景动画 */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            min-height: 100vh;
        }
        
        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: var(--shadow);
        }
        
        .header-title h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--text-primary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .header-title p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            height: calc(100vh - 140px);
        }
        
        /* 左侧面板 */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
        }
        
        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 图片上传 */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(14, 165, 233, 0.02);
        }
        
        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(14, 165, 233, 0.05);
        }
        
        .upload-area.has-image {
            border-style: solid;
            border-color: var(--primary);
            padding: 12px;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        
        .upload-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .upload-hint {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        
        .upload-area input { display: none; }
        
        .preview-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .preview-container img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .preview-overlay {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .preview-overlay:hover {
            background: rgba(239, 68, 68, 0.9);
        }
        
        /* 输入框 */
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group:last-child { margin-bottom: 0; }
        
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        
        textarea.form-input {
            resize: vertical;
            min-height: 80px;
        }
        
        /* 按钮 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--secondary) 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
        
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
        }
        
        .btn-block { width: 100%; }
        
        /* 右侧聊天区 */
        .chat-panel {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border);
        }
        
        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .chat-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .chat-info h3 {
            font-size: 15px;
            font-weight: 600;
        }
        
        .chat-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .chat-actions {
            display: flex;
            gap: 8px;
        }
        
        .chat-action-btn {
            padding: 8px 12px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .chat-action-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        
        /* 消息列表 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        }
        
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--secondary) 0%, #059669 100%);
        }
        
        .message-content {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .message.assistant .message-content {
            background: var(--bg-hover);
            border-bottom-left-radius: 4px;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-bottom-right-radius: 4px;
        }
        
        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 6px;
            opacity: 0.7;
        }
        
        .message.user .message-time {
            text-align: right;
        }
        
        /* 消息中的 markdown */
        .message-content p { margin: 6px 0; }
        .message-content p:first-child { margin-top: 0; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin: 8px 0; padding-left: 20px; }
        .message-content li { margin: 4px 0; }
        .message-content strong { font-weight: 600; }
        .message-content code {
            background: rgba(0,0,0,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        /* 输入区 */
        .chat-input-area {
            padding: 16px 20px;
            background: rgba(15, 23, 42, 0.5);
            border-top: 1px solid var(--border);
        }
        
        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            font-family: inherit;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .chat-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        /* 欢迎状态 */
        .welcome-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-secondary);
        }
        
        .welcome-icon {
            font-size: 64px;
            margin-bottom: 24px;
            opacity: 0.5;
        }
        
        .welcome-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        
        .welcome-desc {
            font-size: 14px;
            max-width: 400px;
            line-height: 1.8;
        }
        
        .feature-list {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--bg-hover);
            border-radius: 10px;
            font-size: 13px;
        }
        
        /* 异常卡片 */
        .anomaly-alert {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(245, 158, 11, 0.1) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }
        
        .anomaly-alert-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--danger);
            margin-bottom: 8px;
        }
        
        .anomaly-list-compact {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .anomaly-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            font-size: 12px;
            color: #fca5a5;
        }
        
        .anomaly-tag .score {
            background: rgba(239, 68, 68, 0.3);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 11px;
        }
        
        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 4px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* 报告面板 */
        .report-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        
        /* ── 内嵌异常提示卡片（无报告时显示）─────────────────────────── */
        .inline-alert {
            margin-top: 12px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(245, 158, 11, 0.08) 100%);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .inline-alert-header {
            font-weight: 600;
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 8px;
        }

        /* ── 报告卡片（内嵌聊天消息）────────────────────────────────── */
        .report-card {
            margin-top: 14px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .report-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.15);
        }
        .report-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(5, 150, 105, 0.06) 100%);
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
        }
        .report-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--secondary);
        }
        .report-card-action {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .report-card-body {
            padding: 12px 16px;
        }
        .report-card-summary {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .report-card-summary.open {
            -webkit-line-clamp: unset;
            overflow: visible;
        }
        .report-card-summary-toggle {
            font-size: 12px;
            color: var(--primary);
            cursor: pointer;
            margin-top: 6px;
            user-select: none;
        }
        .report-card-anomalies {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .report-card-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            font-size: 12px;
            color: var(--danger);
        }
        .report-card-tag .score {
            opacity: 0.7;
            font-size: 11px;
        }

        /* ── 报告侧边栏（右侧滑入）──────────────────────────────────── */
        .report-sidebar {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(680px, 100vw);
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            box-shadow: -8px 0 32px rgba(0,0,0,0.4);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .report-sidebar.open {
            transform: translateX(0);
        }
        .report-sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .report-sidebar-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }
        .report-sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg-card);
        }
        .report-sidebar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .report-sidebar-title span { font-size: 20px; }
        .report-sidebar-close {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s, color 0.2s;
        }
        .report-sidebar-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        .report-sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        /* ── 报告侧边栏 Markdown 样式（与 report-body 对齐）── */
        .report-sidebar-body h1 { font-size: 22px; margin: 20px 0 16px; color: var(--text-primary); border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .report-sidebar-body h2 { font-size: 18px; margin: 18px 0 12px; color: var(--primary); }
        .report-sidebar-body h3 { font-size: 16px; margin: 16px 0 10px; color: var(--text-primary); }
        .report-sidebar-body p { margin: 12px 0; line-height: 1.8; color: var(--text-secondary); }
        .report-sidebar-body ul, .report-sidebar-body ol { margin: 12px 0; padding-left: 24px; }
        .report-sidebar-body li { margin: 6px 0; color: var(--text-secondary); }
        .report-sidebar-body strong { color: var(--primary); font-weight: 600; }
        .report-sidebar-body code { background: var(--bg-dark); padding: 2px 8px; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 13px; color: var(--secondary); }
        .report-sidebar-body pre { background: var(--bg-dark); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
        .report-sidebar-body pre code { background: transparent; padding: 0; }
        .report-sidebar-body blockquote { border-left: 4px solid var(--primary); margin: 16px 0; padding-left: 16px; color: var(--text-secondary); font-style: italic; }
        .report-sidebar-body table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .report-sidebar-body th, .report-sidebar-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .report-sidebar-body th { background: var(--bg-hover); font-weight: 600; color: var(--primary); }
        .report-sidebar-body tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .report-sidebar-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        .report-sidebar-body .anomaly-detail-card {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        .report-sidebar-body .anomaly-detail-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .report-sidebar-body .anomaly-detail-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* ── 报告头部（旧版全屏覆盖层，保留兼容）────────────────────── */
        .report-panel {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-dark);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .report-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .report-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .report-title h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--secondary);
        }
        
        .report-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        /* 报告 markdown 样式 */
        .report-body h1 { font-size: 22px; margin: 20px 0 16px; color: var(--text-primary); border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
        .report-body h2 { font-size: 18px; margin: 18px 0 12px; color: var(--primary); }
        .report-body h3 { font-size: 16px; margin: 16px 0 10px; color: var(--text-primary); }
        .report-body p { margin: 12px 0; line-height: 1.8; }
        .report-body ul, .report-body ol { margin: 12px 0; padding-left: 24px; }
        .report-body li { margin: 6px 0; }
        .report-body strong { color: var(--primary); font-weight: 600; }
        .report-body code { background: var(--bg-dark); padding: 2px 8px; border-radius: 4px; font-family: 'Fira Code', monospace; font-size: 13px; color: var(--secondary); }
        .report-body pre { background: var(--bg-dark); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 16px 0; }
        .report-body pre code { background: transparent; padding: 0; }
        .report-body blockquote { border-left: 4px solid var(--primary); margin: 16px 0; padding-left: 16px; color: var(--text-secondary); font-style: italic; }
        .report-body table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .report-body th, .report-body td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .report-body th { background: var(--bg-hover); font-weight: 600; color: var(--primary); }
        .report-body tr:nth-child(even) { background: rgba(255,255,255,0.02); }
        .report-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
        
        /* 异常详情卡片 */
        .anomaly-detail-card {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08) 0%, rgba(245, 158, 11, 0.08) 100%);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 12px;
            padding: 16px;
            margin: 12px 0;
        }
        
        .anomaly-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        
        .anomaly-type {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #fca5a5;
        }
        
        .anomaly-confidence {
            padding: 4px 12px;
            background: rgba(239, 68, 68, 0.2);
            border-radius: 20px;
            font-size: 13px;
            color: #fca5a5;
        }
        
        .anomaly-detail-content {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        /* 隐藏 */
        .hidden { display: none !important; }
        
        /* 响应式 */
        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .left-panel {
                max-width: 600px;
                margin: 0 auto;
                width: 100%;
            }
            
            .chat-panel {
                min-height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div class="header-brand">
                <div class="logo">🔍</div>
                <div class="header-title">
                    <h1>MMDL-Agent</h1>
                    <p>智能工业图像检测系统</p>
                </div>
            </div>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">检测中...</span>
            </div>
        </div>
        
        <!-- 主布局 -->
        <div class="main-layout">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <!-- 图片上传 -->
                <div class="card">
                    <div class="card-title">📷 图像上传</div>
                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('imageInput').click()">
                        <div id="uploadPlaceholder">
                            <div class="upload-icon">📤</div>
                            <div class="upload-text">点击上传工业设备图片</div>
                            <div class="upload-hint">支持 JPG、PNG 格式</div>
                        </div>
                        <div class="preview-container hidden" id="previewContainer">
                            <img id="previewImg" src="" alt="预览">
                            <div class="preview-overlay" onclick="event.stopPropagation(); clearImage()">✕ 移除</div>
                        </div>
                        <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
                    </div>
                </div>
                
                <!-- 任务信息 -->
                <div class="card">
                    <div class="card-title">📋 任务信息</div>
                    <div class="form-group">
                        <label class="form-label">任务 ID</label>
                        <input type="text" class="form-input" id="taskId" placeholder="例如：task-001">
                    </div>
                    <div class="form-group">
                        <label class="form-label">资产 ID</label>
                        <input type="text" class="form-input" id="assetId" placeholder="例如：asset-001">
                    </div>
                    <div class="form-group">
                        <label class="form-label">检测问题</label>
                        <textarea class="form-input" id="question" placeholder="例如：这张图片有什么异常？">请分析这张图片的异常情况</textarea>
                    </div>
                    <button class="btn btn-primary btn-block" onclick="startDetection()" id="startBtn">
                        <span>🚀</span> 开始检测
                    </button>
                </div>
            </div>
            
            <!-- 右侧聊天/报告区 -->
            <div class="chat-panel" id="chatPanel">
                <!-- 欢迎状态 -->
                <div class="welcome-state" id="welcomeState">
                    <div class="welcome-icon">🏭</div>
                    <div class="welcome-title">欢迎使用 MMDL-Agent</div>
                    <div class="welcome-desc">
                        上传工业设备图像，AI 将自动检测异常情况。<br>
                        支持多轮对话深入了解检测结果，按需生成完整检测报告。
                    </div>
                    <div class="feature-list">
                        <div class="feature-item">🔍 智能检测</div>
                        <div class="feature-item">💬 多轮对话</div>
                        <div class="feature-item">📄 报告生成</div>
                    </div>
                </div>
                
                <!-- 聊天状态 -->
                <div class="chat-header hidden" id="chatHeader">
                    <div class="chat-title">
                        <div class="chat-avatar">🤖</div>
                        <div class="chat-info">
                            <h3>AI 检测助手</h3>
                            <p id="chatSubtitle">正在进行图像分析...</p>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button class="chat-action-btn" onclick="generateReport()">📄 生成报告</button>
                        <button class="chat-action-btn" onclick="resetToWelcome()">🔄 新检测</button>
                    </div>
                </div>
                
                <div class="chat-messages hidden" id="chatMessages"></div>
                
                <div class="chat-input-area hidden" id="chatInputArea">
                    <div class="input-wrapper">
                        <textarea class="chat-input" id="chatInput" placeholder="继续提问了解更多详情..." rows="1" oninput="autoResize(this)" onkeypress="handleKeyPress(event)"></textarea>
                        <button class="btn btn-primary send-btn" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
            
            <!-- 报告面板（兼容旧功能） -->
            <div class="report-panel hidden" id="reportPanel">
                <div class="report-header">
                    <div class="report-title">
                        <span>📋</span>
                        <h2>检测报告</h2>
                    </div>
                    <button class="btn btn-secondary" onclick="backToChat()">← 返回对话</button>
                </div>
                <div class="report-body" id="reportBody"></div>
            </div>

            <!-- 报告侧边栏（新交互） -->
            <div class="report-sidebar-backdrop hidden" id="reportSidebarBackdrop" onclick="closeReportSidebar()"></div>
            <div class="report-sidebar hidden" id="reportSidebar">
                <div class="report-sidebar-header">
                    <div class="report-sidebar-title"><span>📋</span> 检测报告</div>
                    <button class="report-sidebar-close" onclick="closeReportSidebar()">
                        ✕ 关闭 <span style="opacity:0.5">Esc</span>
                    </button>
                </div>
                <div class="report-sidebar-body" id="reportSidebarBody"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let currentTaskId = null;
        let selectedImage = null;
        let isProcessing = false;
        let currentReport = null;

        // 健康检查 - 定期轮询后端状态
        async function checkHealth() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const statusBadge = statusDot.parentElement;
            try {
                const res = await fetch(`${API_BASE}/health`, { method: 'GET' });
                if (res.ok) {
                    statusDot.style.backgroundColor = '#4ade80';
                    statusBadge.style.borderColor = '#4ade80';
                    statusText.textContent = '系统运行中';
                    statusText.style.color = '#4ade80';
                } else {
                    statusDot.style.backgroundColor = '#f97316';
                    statusBadge.style.borderColor = '#f97316';
                    statusText.textContent = '服务异常';
                    statusText.style.color = '#f97316';
                }
            } catch (e) {
                statusDot.style.backgroundColor = '#ef4444';
                statusBadge.style.borderColor = '#ef4444';
                statusText.textContent = '未连接';
                statusText.style.color = '#ef4444';
            }
        }

        // 启动时检查一次，之后每 10 秒轮询
        checkHealth();
        setInterval(checkHealth, 10000);

        // 页面状态管理 - 不使用 History API，直接管理 DOM
        function updateView(view) {
            const welcome = document.getElementById('welcomeState');
            const chatHeader = document.getElementById('chatHeader');
            const chatMessages = document.getElementById('chatMessages');
            const chatInputArea = document.getElementById('chatInputArea');
            const chatPanel = document.getElementById('chatPanel');
            const reportPanel = document.getElementById('reportPanel');
            
            // 重置所有视图
            welcome.classList.add('hidden');
            chatHeader.classList.add('hidden');
            chatMessages.classList.add('hidden');
            chatInputArea.classList.add('hidden');
            reportPanel.classList.add('hidden');
            
            if (view === 'welcome') {
                welcome.classList.remove('hidden');
            } else if (view === 'chat') {
                chatHeader.classList.remove('hidden');
                chatMessages.classList.remove('hidden');
                chatInputArea.classList.remove('hidden');
            } else if (view === 'report') {
                // 报告面板是固定覆盖层，不需要显示聊天元素
                reportPanel.classList.remove('hidden');
            }
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedImage = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('uploadPlaceholder').classList.add('hidden');
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadArea').classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            selectedImage = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewImg').src = '';
            document.getElementById('uploadPlaceholder').classList.remove('hidden');
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('uploadArea').classList.remove('has-image');
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function addMessage(role, content, isTyping = false, extraData = null) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            if (isTyping) {
                div.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="typing-indicator"><span></span><span></span><span></span></div>
                    </div>
                `;
                div.id = 'typingMessage';
            } else {
                const renderedContent = role === 'assistant' ? marked.parse(content || '') : escapeHtml(content || '');
                div.innerHTML = `
                    <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
                    <div class="message-content">
                        <div>${renderedContent}</div>
                        <div class="message-time">${new Date().toLocaleTimeString()}</div>
                    </div>
                `;
                // 附加报告卡片或异常提示
                if (role === 'assistant' && extraData) {
                    if (extraData.has_report) {
                        addReportCard(div, extraData);
                    } else if (extraData.anomalies && extraData.anomalies.length > 0) {
                        addAnomalyAlertInline(div, extraData.anomalies);
                    }
                }
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function removeTyping() {
            const typing = document.getElementById('typingMessage');
            if (typing) typing.remove();
        }

        function addAnomalyAlertInline(containerDiv, anomalies) {
            const tagsHtml = anomalies.map(a => 
                `<span class="anomaly-tag">${a.type}<span class="score">${(a.score * 100).toFixed(0)}%</span></span>`
            ).join('');
            const alertDiv = document.createElement('div');
            alertDiv.className = 'inline-alert';
            alertDiv.innerHTML = `
                <div class="inline-alert-header">🚨 检测到 ${anomalies.length} 处异常</div>
                <div class="anomaly-list-compact">${tagsHtml}</div>
            `;
            containerDiv.querySelector('.message-content').appendChild(alertDiv);
        }

        function addReportCard(containerDiv, data) {
            currentReport = data;
            const card = document.createElement('div');
            card.className = 'report-card';
            card.id = 'inlineReportCard';
            card.onclick = (e) => { e.stopPropagation(); openReportSidebar(data); };

            const anomalyTags = (data.anomalies || []).map(a => 
                `<span class="report-card-tag">${a.type} <span class="score">${(a.score * 100).toFixed(0)}%</span></span>`
            ).join('');

            const summaryText = data.summary || '暂无报告摘要';
            card.innerHTML = `
                <div class="report-card-header">
                    <div class="report-card-title"><span>📋</span> 检测报告已生成</div>
                    <div class="report-card-action">点击查看 →</div>
                </div>
                <div class="report-card-body">
                    ${anomalyTags ? `<div class="report-card-anomalies">${anomalyTags}</div>` : ''}
                    <div class="report-card-summary">${escapeHtml(summaryText.replace(/[#*`]/g, ''))}</div>
                    <div class="report-card-summary-toggle" onclick="event.stopPropagation(); this.previousElementSibling.classList.toggle('open'); this.textContent = this.previousElementSibling.classList.contains('open') ? '收起 ↑' : '展开 ↓';">
                        展开 ↓
                    </div>
                </div>
            `;
            containerDiv.querySelector('.message-content').appendChild(card);
        }

        function openReportSidebar(data) {
            if (!data) return;
            let html = '';
            if (data.anomalies && data.anomalies.length > 0) {
                html += '<h3 style="margin-bottom:12px;font-size:15px;color:var(--danger);">🚨 异常详情</h3>';
                data.anomalies.forEach(a => {
                    html += `
                        <div class="anomaly-detail-card">
                            <div class="anomaly-detail-header">
                                <div class="anomaly-type">⚠️ ${a.type}</div>
                                <div class="anomaly-confidence">置信度 ${(a.score * 100).toFixed(1)}%</div>
                            </div>
                            <div class="anomaly-detail-content">${a.details || '暂无详细描述'}</div>
                        </div>
                    `;
                });
                html += '<hr style="border:none;border-top:1px solid var(--border);margin:24px 0;">';
            }
            html += (data.summary ? marked.parse(data.summary) : '暂无详细报告');
            document.getElementById('reportSidebarBody').innerHTML = html;
            document.getElementById('reportSidebarBackdrop').classList.remove('hidden');
            document.getElementById('reportSidebar').classList.remove('hidden');
            requestAnimationFrame(() => {
                document.getElementById('reportSidebar').classList.add('open');
                document.getElementById('reportSidebarBackdrop').classList.add('open');
            });
        }

        function closeReportSidebar() {
            document.getElementById('reportSidebar').classList.remove('open');
            document.getElementById('reportSidebarBackdrop').classList.remove('open');
            setTimeout(() => {
                document.getElementById('reportSidebar').classList.add('hidden');
                document.getElementById('reportSidebarBackdrop').classList.add('hidden');
            }, 300);
        }

        // Esc 关闭侧边栏
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeReportSidebar();
        });

        async function startDetection() {
            const taskId = document.getElementById('taskId').value || `task-${Date.now()}`;
            const assetId = document.getElementById('assetId').value || 'asset-001';
            const question = document.getElementById('question').value;
            
            if (!selectedImage) {
                alert('请先选择图片');
                return;
            }

            currentTaskId = taskId;
            isProcessing = true;
            
            // 切换到聊天界面
            updateView('chat');
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('startBtn').innerHTML = '<span>⏳</span> 检测中...';

            // 显示用户问题
            addMessage('user', question);
            
            // 显示输入指示器
            addMessage('assistant', '', true);

            const formData = new FormData();
            formData.append('task_id', taskId);
            formData.append('asset_id', assetId);
            formData.append('start_time', new Date().toISOString());
            formData.append('end_time', new Date().toISOString());
            formData.append('question', question);
            formData.append('image', selectedImage);

            try {
                // 首次检测只返回答案，不生成报告
                const res = await fetch(`${API_BASE}/v1/detect`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                
                removeTyping();
                
                if (data.status === 'success') {
                    // 答案 + 异常提示（无报告卡片）
                    addMessage('assistant', data.answer, false, {
                        anomalies: data.anomalies,
                    });
                    document.getElementById('chatSubtitle').textContent = '检测完成，可进行多轮对话或生成报告';
                } else if (data.status === 'pending') {
                    addMessage('assistant', '需要更多信息：' + data.pending_question);
                } else {
                    addMessage('assistant', '❌ 检测失败：' + (data.metadata?.errors?.join(', ') || '未知错误'));
                }
            } catch (err) {
                removeTyping();
                addMessage('assistant', '❌ 网络错误：' + err.message);
            } finally {
                isProcessing = false;
                document.getElementById('startBtn').disabled = false;
                document.getElementById('startBtn').innerHTML = '<span>🚀</span> 开始检测';
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            if (!question || isProcessing) return;

            addMessage('user', question);
            input.value = '';
            input.style.height = 'auto';
            
            addMessage('assistant', '', true);
            isProcessing = true;

            try {
                const res = await fetch(`${API_BASE}/v1/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_id: currentTaskId, question })
                });
                const data = await res.json();
                
                removeTyping();
                
                if (data.status === 'success') {
                    addMessage('assistant', data.answer);
                } else {
                    addMessage('assistant', '抱歉，处理失败，请重试。');
                }
            } catch (err) {
                removeTyping();
                addMessage('assistant', '❌ 网络错误：' + err.message);
            } finally {
                isProcessing = false;
            }
        }

        async function generateReport() {
            if (isProcessing) return;
            if (!currentTaskId) return;

            isProcessing = true;
            addMessage('assistant', '', true);  // 打字机动画

            try {
                const res = await fetch(`${API_BASE}/v1/generate_report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ task_id: currentTaskId })
                });
                const data = await res.json();
                removeTyping();

                if (data.status === 'success') {
                    currentReport = data;
                    // 报告卡片加入聊天记录，方便反复查看
                    addMessage('assistant', data.answer || '', false, {
                        has_report: true,
                        summary: data.summary,
                        anomalies: data.anomalies,
                    });
                    openReportSidebar(data);
                } else {
                    addMessage('assistant', '❌ 生成报告失败：' + (data.metadata?.errors?.join(', ') || '未知错误'));
                }
            } catch (err) {
                removeTyping();
                addMessage('assistant', '❌ 网络错误：' + err.message);
            } finally {
                isProcessing = false;
            }
        }

        function showReport(data) {
            // 渲染报告
            let reportHtml = '';
            
            // 异常详情卡片
            if (data.anomalies && data.anomalies.length > 0) {
                reportHtml += '<h2>🚨 异常检测结果</h2>';
                data.anomalies.forEach(a => {
                    reportHtml += `
                        <div class="anomaly-detail-card">
                            <div class="anomaly-detail-header">
                                <div class="anomaly-type">⚠️ ${a.type}</div>
                                <div class="anomaly-confidence">置信度 ${(a.score * 100).toFixed(1)}%</div>
                            </div>
                            <div class="anomaly-detail-content">${a.details || '暂无详细描述'}</div>
                        </div>
                    `;
                });
            }
            
            // 报告正文
            reportHtml += (data.summary ? marked.parse(data.summary) : '暂无详细报告');
            
            document.getElementById('reportBody').innerHTML = reportHtml;
            
            // 切换视图
            updateView('report');
        }

        function backToChat() {
            // 直接切换回聊天视图，报告数据保存在 currentReport
            updateView('chat');
        }

        function resetToWelcome() {
            // 清除状态
            currentTaskId = null;
            currentReport = null;
            selectedImage = null;
            
            // 清空聊天记录
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chatSubtitle').textContent = '正在进行图像分析...';
            
            // 清空图片预览
            clearImage();
            
            // 清空输入
            document.getElementById('taskId').value = '';
            document.getElementById('assetId').value = '';
            document.getElementById('question').value = '请分析这张图片的异常情况';
            
            // 返回欢迎页
            updateView('welcome');
        }
    </script>
</body>
</html>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-anomaly-agent"
version = "0.1.0"
description = "Production-ready LangChain + LangGraph industrial anomaly detection agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MMDL" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langchain>=0.2",
  "langgraph>=0.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "orjson>=3.10",
  "psycopg[binary]>=3.2",
  "langgraph-checkpoint-postgres>=3.0",
  "langchain-openai>=0.1",
  "dashscope>=1.20.0",
  "chromadb>=0.4.0",
  "pillow>=10.0",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "swagger-ui-bundle>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["app", "web"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
